<!-- Template parcial: Lista de GCMs da Guarnição -->
<div id="secao-guarnicao" class="card bg-body-tertiary border-0 border-start border-4 shadow-sm mb-3" style="border-color: #1ea0ba !important;">
    <div class="card-header bg-transparent border-bottom py-2 px-3 px-sm-4 w-100 d-flex justify-content-between align-items-center">
        <h2 class="h6 fw-bold text-uppercase mb-0" style="color: #1ea0ba;">
            6. Guarnição / Apoio
        </h2>
        <button type="button" 
                class="btn btn-primary btn-sm fw-semibold text-nowrap ms-auto" 
                data-bs-toggle="modal" 
                data-bs-target="#modalGuarnicao"
                hx-get="{% url 'boletim_guarnicao_modal' object.pk %}"
                hx-target="#conteudo-modal-guarnicao"
            >
            <i class="bi bi-shield-plus me-1"></i>Adicionar GCM
        </button>
    </div>
    <div class="card-body p-3">
        <div class="d-flex flex-wrap gap-2" id="lista-guarnicao">
            {% for gcm in object.guarnicao.all %}
                <div class="d-inline-flex align-items-center gap-2 px-2 py-1 rounded-2 bg-body border shadow-sm">
                    <span class="fw-bold text-body-emphasis small">{{ gcm.nome_guerra }}</span>
                    <button type="button" 
                            class="btn btn-outline-danger btn-sm py-0 px-1 border-0" 
                            title="Remover da Guarnição"
                            hx-post="{% url 'boletim_guarnicao_remover' object.pk gcm.id %}"
                            hx-target="#secao-guarnicao"
                            hx-swap="outerHTML">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>
            {% empty %}
                <span class="small text-body-secondary fst-italic">Nenhum GCM de apoio adicionado.</span>
            {% endfor %}
        </div>
    </div>
</div>

{% comment %} 
<div class="card bg-body-tertiary border-0 border-start border-4 shadow-sm mb-3" style="border-color: #1ea0ba !important;">
            <div class="card-header bg-transparent border-bottom py-2 px-3 px-sm-4 w-100 d-flex justify-content-between align-items-center">
                <h2 class="h6 fw-bold text-uppercase mb-0" style="color: #1ea0ba;">
                    6. Guarnição
                </h2>
                <button type="button" class="btn btn-primary btn-sm fw-semibold text-nowrap ms-auto" data-bs-toggle="modal" data-bs-target="#modalGuarnicao">
                    <i class="bi bi-shield-plus me-1"></i> Adicionar GCM
                </button>
            </div>
            <div class="card-body p-3">
                <div class="d-flex flex-wrap gap-2" id="lista-guarnicao">
                    {% for gcm in object.guarnicao.all %}
                        <div id="guarnicao-item-{{ gcm.id }}" class="d-inline-flex align-items-center gap-2 px-2 py-1 rounded-2 bg-body border shadow-sm">
                            <span class="fw-bold text-body-emphasis small">{{gcm.nome_guerra}}</span>
                            <button type="button" class="btn btn-outline-danger btn-sm py-0 px-1 border-0" title="Remover da Guarnição">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    {% empty %}
                        <span class="small text-body-secondary fst-italic">Nenhum GCM de apoio adicionado.</span>
                    {% endfor %}                   
                </div>
            </div>
        </div> 
{% endcomment %}
