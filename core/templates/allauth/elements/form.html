{% load allauth %}
<form method="{{ attrs.method|default:'post' }}" action="{{ attrs.action }}">
    {% csrf_token %}    
    
    <div class="mb-3">
        {% slot body %}
        {% endslot %}
    </div>

    <div class="d-grid gap-2 mt-4">
        {% slot actions %}
        {% endslot %}
    </div>
</form>
